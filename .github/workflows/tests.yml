name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Resolve the faster-whisper runtime and reject PyAV 19
        run: |
          python -m pip install --upgrade pip
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "podcast-transcript-public/scripts")
          from model_catalog import package_requirements
          requirements = package_requirements("faster")
          if "av>=11,<19" not in requirements:
              raise SystemExit(f"faster runtime is missing the PyAV pin: {requirements}")
          Path("/tmp/faster-reqs.txt").write_text("\n".join(requirements) + "\n", encoding="utf-8")
          # huggingface-hub==1.27.0 and faster-whisper need Python >= 3.10.
          # PyAV 19 wheels exist only for Python >= 3.12. Older interpreters
          # still resolve the pin itself.
          Path("/tmp/resolve-mode.txt").write_text(
              "full" if sys.version_info >= (3, 10) else "pin",
              encoding="utf-8",
          )
          PY
          if [ "$(cat /tmp/resolve-mode.txt)" = "full" ]; then
            python -m pip install --dry-run --ignore-installed -r /tmp/faster-reqs.txt | tee /tmp/faster-dry-run.txt
          else
            python -m pip install --dry-run --ignore-installed 'av>=11,<19' | tee /tmp/faster-dry-run.txt
          fi
          python - <<'PY'
          import re
          from pathlib import Path
          text = Path("/tmp/faster-dry-run.txt").read_text(encoding="utf-8")
          selected = re.findall(r"\bav-(\d+)\.(\d+)(?:\.(\d+))?", text)
          if not selected:
              raise SystemExit("resolver did not select av:\n" + text)
          for major, _minor, _patch in selected:
              if int(major) < 11 or int(major) >= 19:
                  raise SystemExit(f"incompatible av selection: {selected}\n{text}")
          print("resolved av", selected)
          PY
          if python -c 'import sys; raise SystemExit(0 if sys.version_info >= (3, 12) else 1)'; then
            set +e
            python -m pip install --dry-run --ignore-installed 'av==19.0.1' 'av>=11,<19' > /tmp/av19.txt 2>&1
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then
              echo "av 19.0.1 was accepted by the pin"
              cat /tmp/av19.txt
              exit 1
            fi
            if ! grep -Eq "ResolutionImpossible|conflicting dependencies|Cannot install" /tmp/av19.txt; then
              echo "av 19 rejection was not a dependency conflict"
              cat /tmp/av19.txt
              exit 1
            fi
          fi
